name: Deploy recommend-web (Pages)

on:
  push:
    branches: [main]
    paths:
      - 'recommend-web/**'
      - '.github/workflows/recommend-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v4
      - name: Bundle site
        run: |
          mkdir -p site
          cp -r recommend-web site/recommend-web
          cat > site/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
          <title>countdown-clock</title></head><body>
          <p><a href="./recommend-web/">澳门特码推荐</a></p>
          <p>寻伴已迁至 <a href="https://github.com/meandyson66/findmatch">findmatch 仓库</a></p>
          </body></html>
          HTML
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4