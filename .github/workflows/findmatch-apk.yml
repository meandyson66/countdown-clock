name: Build FindMatch APK

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'android/findmatch/**'
      - 'package.json'
      - 'vite.config.js'
  workflow_dispatch:
  release:
    types: [published]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run sync:android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: assembleRelease
        working-directory: android
        run: gradle :findmatch:assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: findmatch-apk
          path: android/findmatch/build/outputs/apk/release/findmatch-release.apk
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            android/findmatch/build/outputs/apk/release/findmatch-release.apk \
            --clobber