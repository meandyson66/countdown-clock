plugins {
    id "com.android.application"
}

android {
    namespace "com.meandyson.sakuracountdown"
    compileSdk 35

    defaultConfig {
        applicationId "com.meandyson.sakuracountdown"
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName "1.3"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.register("syncWeb", Copy) {
    from("${rootDir}/../index.html")
    into("${projectDir}/src/main/assets")
}

tasks.named("preBuild").configure {
    dependsOn("syncWeb")
}
