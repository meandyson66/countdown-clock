plugins {
    id "com.android.application"
}

android {
    namespace "com.meandyson.macaurecommend"
    compileSdk 35

    defaultConfig {
        applicationId "com.meandyson.macaurecommend"
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName "1.8.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
