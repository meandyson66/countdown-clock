plugins {
    id "com.android.application"
}

android {
    namespace "com.meandyson.macaurecommend"
    compileSdk 35

    defaultConfig {
        applicationId "com.meandyson.macaurecommend"
        minSdk 26
        targetSdk 35
        versionCode 13
        versionName "1.8.4"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
