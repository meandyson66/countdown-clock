<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>特码推荐</title>
  <link rel="stylesheet" href="app.css?v=history-sheet">
</head>
<body>
  <svg class="branch" viewBox="0 0 480 230" aria-hidden="true">
    <path d="M30 200C90 160 130 120 190 98c48-18 86-18 130-8 38 8 78 4 120-28" fill="none" stroke="#E7A0B4" stroke-width="3" stroke-linecap="round"/>
    <g fill="#FFB7C9">
      <circle cx="118" cy="132" r="8"/><circle cx="132" cy="118" r="7"/><circle cx="108" cy="116" r="6"/>
      <circle cx="196" cy="96" r="9"/><circle cx="214" cy="84" r="7"/><circle cx="184" cy="82" r="6"/>
      <circle cx="292" cy="86" r="8"/><circle cx="308" cy="74" r="6"/><circle cx="278" cy="74" r="6"/>
      <circle cx="392" cy="58" r="9"/><circle cx="410" cy="46" r="7"/><circle cx="378" cy="44" r="6"/>
    </g>
  </svg>
  <canvas id="petals" aria-hidden="true"></canvas>
  <main id="app">
    <section class="panel"><h2>正在计算</h2><p class="fine" id="status">1.8.4 正在读取最新开奖…</p></section>
  </main>
  <div id="historyBackdrop" class="history-backdrop" hidden></div>
  <div id="historyModal" class="history-sheet" hidden aria-hidden="true" role="dialog" aria-labelledby="modalTitle">
    <div class="history-sheet-chrome">
      <button type="button" class="sheet-grab glass-pressable" id="history-grab" aria-label="下滑收起历史统计">
        <span class="dock-handle" aria-hidden="true"></span>
        <span class="sheet-grab-title">历史统计</span>
        <span class="sheet-grab-hint">下滑收起</span>
      </button>
    </div>
    <header class="history-head history-sheet-drag">
      <div class="history-head-main">
        <span id="modalNumberBadge" class="history-badge num">17</span>
        <h3 id="modalTitle" class="history-title">号码 17 · 历史数据看板</h3>
      </div>
      <button type="button" class="history-close glass-pressable" id="close-history" aria-label="关闭">✕</button>
    </header>
    <div class="history-body">
      <div class="history-subtabs" id="historySubtabs">
        <button type="button" class="history-subtab lottery-tab on" data-stats-kind="new">新澳门</button>
        <button type="button" class="history-subtab lottery-tab" data-stats-kind="old">老澳门</button>
        <button type="button" class="history-subtab lottery-tab" data-stats-kind="hk">香港</button>
      </div>
      <div class="history-card history-pick-card">
        <p class="history-card-title">快速切换分析号码</p>
        <div class="history-mini-grid" id="miniNumberGrid"></div>
      </div>
      <section class="time-filter-section" aria-labelledby="timeFilterLabel">
        <p id="timeFilterLabel" class="time-filter-title">时间范围筛选</p>
        <div class="time-btn-group">
          <button type="button" class="time-btn" data-days="7">一周</button>
          <button type="button" class="time-btn" data-days="15">半个月</button>
          <button type="button" class="time-btn active" data-days="30">一个月</button>
          <button type="button" class="time-btn" data-days="90">三个月</button>
          <button type="button" class="time-btn" data-days="180">半年</button>
          <button type="button" class="time-btn" data-days="365">一年</button>
        </div>
        <div class="time-stats-result">
          <div class="time-stat-box te">
            <span class="time-stat-label">所选期间特码开出</span>
            <strong id="statTeCount" class="time-stat-value num">0 次</strong>
          </div>
          <div class="time-stat-box ping">
            <span class="time-stat-label">所选期间平码开出</span>
            <strong id="statPingCount" class="time-stat-value num">0 次</strong>
          </div>
        </div>
      </section>
      <p class="history-section-label">往期开奖</p>
      <p class="fine history-official-hint">按当前彩种展示每期全部号码，与上方所选分析号码无关。</p>
      <div class="history-official" id="historyListContainer"></div>
    </div>
  </div>
  <script src="engine.js?v=history-sheet"></script>
  <script>
    const canvas = document.getElementById("petals");
    const ctx = canvas.getContext("2d");
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (!reduce && ctx) {
      const petals = Array.from({ length: 16 }, () => ({
        x: Math.random(), y: Math.random(), r: 5 + Math.random() * 6,
        v: 0.35 + Math.random() * 0.5, a: Math.random() * 6, spin: (Math.random() - 0.5) * 0.02,
      }));
      let resizing = false;
      function resize() {
        if (resizing) return;
        resizing = true;
        const dpr = devicePixelRatio || 1;
        const ratio = dpr > 2 ? 2 : dpr;
        canvas.width = Math.floor(innerWidth * ratio);
        canvas.height = Math.floor(innerHeight * ratio);
        canvas.style.width = innerWidth + "px";
        canvas.style.height = innerHeight + "px";
        ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
        resizing = false;
      }
      let painting = false;
      function frame() {
        if (painting) return;
        painting = true;
        ctx.clearRect(0, 0, innerWidth, innerHeight);
        for (let i = 0; i < petals.length; i += 1) {
          const p = petals[i];
          p.y += p.v / innerHeight;
          p.x += Math.sin(p.y * 12) * 0.0015;
          p.a += p.spin;
          if (p.y > 1.05) { p.y = -0.05; p.x = Math.random(); }
          ctx.save();
          ctx.translate(p.x * innerWidth, p.y * innerHeight);
          ctx.rotate(p.a);
          ctx.globalAlpha = 0.45;
          ctx.fillStyle = "#FF9BB3";
          ctx.beginPath();
          ctx.moveTo(0, -p.r * 0.2);
          ctx.bezierCurveTo(p.r, -p.r, p.r * 0.7, p.r, 0, p.r * 1.4);
          ctx.bezierCurveTo(-p.r * 0.7, p.r, -p.r, -p.r, 0, -p.r * 0.2);
          ctx.fill();
          ctx.restore();
        }
        painting = false;
      }
      resize();
      addEventListener("resize", resize);
      setInterval(frame, 32);
    }
  </script>
</body>
</html>
