<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffd6e0">
  <title>樱花倒计时</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #8a4d63;
      --muted: rgba(154, 98, 122, 0.72);
      --g1: #ffd0e0;
      --g2: #ff7aa2;
      --g3: #d7b3ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--ink);
      font-family: "Nunito", "PingFang SC", "Microsoft YaHei", sans-serif;
      color-scheme: light;
      background: linear-gradient(125deg, #ffd6e0, #fff6ea, #f3d5ff, #ffe8f1, #fffaf4, #ffd6e0);
      background-size: 340% 340%;
      animation: flow 18s ease-in-out infinite;
      -webkit-font-smoothing: antialiased;
    }

    .aurora,
    .floaters {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .aurora {
      z-index: 0;
    }

    .aurora span {
      position: absolute;
      width: 46vw;
      height: 46vw;
      min-width: 240px;
      min-height: 240px;
      border-radius: 50%;
      filter: blur(36px);
      opacity: 0.85;
      animation: drift 16s ease-in-out infinite;
    }

    .aurora span:nth-child(1) {
      top: -14%;
      left: -10%;
      background: #ffd6e0;
    }

    .aurora span:nth-child(2) {
      top: 16%;
      right: -16%;
      background: #f3d5ff;
      animation-delay: -6s;
    }

    .aurora span:nth-child(3) {
      left: 18%;
      bottom: -22%;
      background: #fff1d6;
      animation-delay: -11s;
    }

    .floaters {
      z-index: 1;
    }

    .floater {
      position: absolute;
      top: 110vh;
      opacity: 0;
      animation-name: rise;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
      will-change: transform, opacity;
    }

    .petal {
      background: linear-gradient(145deg, rgba(255, 186, 206, 0.9), rgba(255, 236, 242, 0.35));
      border-radius: 80% 12% 76% 16%;
      box-shadow: inset -3px -2px 5px rgba(255, 255, 255, 0.55);
    }

    .bubble {
      border-radius: 50%;
      background:
        radial-gradient(circle at 32% 30%, rgba(255, 255, 255, 0.95), rgba(255, 214, 228, 0.2) 52%, rgba(243, 213, 255, 0.08));
      border: 1px solid rgba(255, 255, 255, 0.75);
    }

    .stage {
      position: relative;
      z-index: 2;
      width: min(460px, calc(100% - 28px));
      padding: 18px 0 max(18px, env(safe-area-inset-bottom));
    }

    .card {
      position: relative;
      padding: 26px 22px 18px;
      border-radius: 32px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.56), rgba(255, 255, 255, 0.3));
      border: 1px solid rgba(255, 255, 255, 0.74);
      backdrop-filter: blur(22px) saturate(1.4);
      -webkit-backdrop-filter: blur(22px) saturate(1.4);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.92),
        inset 0 0 0 1px rgba(255, 255, 255, 0.28),
        0 22px 54px rgba(232, 150, 186, 0.3);
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.5px;
      background: linear-gradient(160deg, rgba(255, 255, 255, 0.98), rgba(255, 255, 255, 0.08) 42%, rgba(255, 214, 230, 0.45));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      mask-composite: exclude;
      pointer-events: none;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 6px;
    }

    .sakura {
      width: 16px;
      height: 16px;
      border-radius: 80% 10% 75% 15%;
      background: linear-gradient(140deg, #ff9eb8, #ffd6e4);
      box-shadow: 0 0 12px rgba(255, 150, 184, 0.8);
      animation: sway 3.4s ease-in-out infinite;
    }

    .eyebrow {
      font-family: "ZCOOL KuaiLe", "PingFang SC", cursive;
      letter-spacing: 0.22em;
      font-size: 13px;
      color: #d46b8d;
    }

    h1 {
      font-family: "ZCOOL KuaiLe", "PingFang SC", cursive;
      text-align: center;
      font-size: 34px;
      font-weight: 400;
      letter-spacing: 0.12em;
      color: #c45b7c;
      text-shadow: 0 8px 24px rgba(255, 170, 196, 0.35);
    }

    .dial {
      position: relative;
      width: min(300px, 78vw);
      margin: 26px auto 14px;
      aspect-ratio: 1;
      overflow: visible;
    }

    .ring {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .track,
    .progress {
      fill: none;
      stroke-width: 10;
    }

    .track {
      stroke: rgba(255, 255, 255, 0.62);
    }

    .progress {
      stroke: url(#macaron);
      stroke-linecap: round;
      transform: rotate(-90deg);
      transform-origin: 100px 100px;
      filter: drop-shadow(0 0 7px rgba(255, 122, 162, 0.72));
    }

    .walker {
      pointer-events: none;
    }

    .walker .shadow { fill: rgba(214, 120, 160, 0.28); }
    .walker .leg line { stroke: #e7b09a; stroke-width: 1.05; stroke-linecap: round; }
    .walker .leg ellipse { fill: #ff8aaf; }
    .walker .arm line { stroke: #f0c2b0; stroke-width: 0.85; stroke-linecap: round; }
    .walker .hand { fill: #ffe3d4; }
    .walker .dress { fill: #ffb0cb; }
    .walker .top { fill: #fff7f4; }
    .walker .head { fill: #ffe3d4; }
    .walker .hair,
    .walker .bangs { fill: #6e4456; }
    .walker .blush { fill: #ffb0c4; }
    .walker .eye { fill: #5c3b48; }
    .walker .smile { fill: none; stroke: #e989a6; stroke-width: 0.4; stroke-linecap: round; }
    .walker .bow { fill: #ff7aa2; }
    .walker .bow-knot { fill: #ff5f90; }

    .readout {
      position: absolute;
      inset: 0;
      display: grid;
      place-content: center;
      text-align: center;
      pointer-events: none;
    }

    .display {
      font-weight: 800;
      font-size: clamp(34px, 8vw, 52px);
      letter-spacing: 0.04em;
      color: #c45378;
      text-shadow: 0 8px 22px rgba(255, 143, 184, 0.38);
      font-variant-numeric: tabular-nums;
    }

    .digit,
    .colon {
      display: inline-block;
    }

    .colon {
      padding: 0 1px;
      opacity: 0.72;
    }

    .digit.pop {
      animation: pop 0.42s cubic-bezier(0.2, 0.85, 0.32, 1.45);
    }

    .status {
      margin: 0 0 12px;
      min-height: 20px;
      text-align: center;
      letter-spacing: 0.22em;
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
    }

    .setters {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .setters label {
      display: grid;
      gap: 6px;
      text-align: center;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.2em;
      color: var(--muted);
    }

    .setters input {
      width: 100%;
      height: 48px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.42);
      color: var(--ink);
      font: inherit;
      font-size: 20px;
      font-weight: 800;
      text-align: center;
      outline: none;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8);
      transition: border-color 0.25s ease, box-shadow 0.25s ease, transform 0.25s ease;
      -moz-appearance: textfield;
      appearance: textfield;
    }

    .setters input::-webkit-outer-spin-button,
    .setters input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .setters input:focus {
      border-color: rgba(255, 143, 184, 0.9);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.9),
        0 0 0 4px rgba(255, 182, 204, 0.35);
    }

    .setters input:disabled {
      opacity: 0.48;
    }

    .presets {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin: 14px 0;
    }

    .presets button,
    .btn {
      font-family: inherit;
      cursor: pointer;
      border: 0;
      transition:
        transform 0.34s cubic-bezier(0.34, 1.56, 0.64, 1),
        box-shadow 0.28s ease,
        background 0.28s ease,
        color 0.28s ease,
        opacity 0.28s ease;
    }

    .presets button {
      padding: 8px 13px;
      border-radius: 999px;
      color: #a45b76;
      background: rgba(255, 255, 255, 0.46);
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 6px 16px rgba(226, 160, 186, 0.16);
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .presets button:hover,
    .btn:hover {
      transform: translateY(-2px) scale(1.06);
      box-shadow: 0 14px 28px rgba(214, 130, 168, 0.34);
    }

    .presets button:active,
    .btn:active {
      transform: scale(0.94);
      box-shadow: 0 6px 14px rgba(214, 130, 168, 0.22);
    }

    .presets button.active {
      color: #fff;
      background: linear-gradient(105deg, #ffb3c9, #ff8fb3 48%, #d7b0ff);
      box-shadow: 0 10px 22px rgba(255, 143, 184, 0.4);
    }

    .presets button:disabled {
      opacity: 0.42;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .actions {
      display: grid;
      grid-template-columns: 1.45fr 0.75fr;
      gap: 10px;
    }

    .btn {
      height: 52px;
      border-radius: 18px;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 0.16em;
    }

    .btn.primary {
      color: #fff;
      background: linear-gradient(105deg, #ffc2d4 0%, #ff8fb3 42%, #d9b6ff 100%);
      box-shadow: 0 12px 26px rgba(255, 143, 184, 0.4);
      text-shadow: 0 1px 2px rgba(176, 72, 112, 0.25);
    }

    .btn.primary.is-live {
      background: linear-gradient(105deg, #ffe3b0, #ffc2d6 52%, #e4c8ff);
      color: #9a4e68;
      text-shadow: none;
    }

    .btn.ghost {
      color: #a45b76;
      background: rgba(255, 255, 255, 0.42);
      border: 1px solid rgba(255, 255, 255, 0.82);
      box-shadow: 0 8px 18px rgba(226, 160, 186, 0.16);
    }

    .keys {
      margin-top: 12px;
      text-align: center;
      color: rgba(154, 98, 122, 0.62);
      letter-spacing: 0.12em;
      font-size: 12px;
      font-weight: 700;
    }

    .card.is-warn {
      --g1: #ffe3bf;
      --g2: #ffb067;
      --g3: #ff9ebf;
      --ink: #a86432;
    }

    .card.is-danger,
    .card.is-done {
      --g1: #ffd0dc;
      --g2: #ff6d8a;
      --g3: #ffc0d4;
    }

    .card.is-warn .display {
      color: #e08a3c;
      text-shadow: 0 8px 22px rgba(255, 176, 103, 0.4);
    }

    .card.is-danger .display,
    .card.is-done .display {
      color: #e45b78;
      text-shadow: 0 8px 22px rgba(255, 109, 138, 0.42);
    }

    .card.is-done {
      animation: celebrate 1.8s ease-in-out infinite;
    }

    .card.is-empty .walker {
      opacity: 0;
    }

    @keyframes flow {
      0% { background-position: 0% 40%; }
      50% { background-position: 100% 60%; }
      100% { background-position: 0% 40%; }
    }

    @keyframes drift {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(7vw, 5vh, 0) scale(1.12); }
    }

    @keyframes rise {
      0% { transform: translate3d(0, 0, 0) rotate(0deg); opacity: 0; }
      10% { opacity: var(--a); }
      100% { transform: translate3d(var(--drift), -125vh, 0) rotate(var(--spin)); opacity: 0; }
    }

    @keyframes pop {
      0% { transform: scale(1); }
      42% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    @keyframes celebrate {
      0%, 100% {
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.92),
          0 18px 40px rgba(255, 160, 196, 0.24);
      }
      50% {
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.98),
          0 0 0 10px rgba(255, 182, 204, 0.18),
          0 22px 64px rgba(255, 120, 168, 0.48),
          0 0 52px rgba(210, 160, 255, 0.42);
      }
    }

    @keyframes sway {
      0%, 100% { transform: rotate(-12deg); }
      50% { transform: rotate(16deg); }
    }

    @media (max-width: 520px) {
      h1 { font-size: 28px; letter-spacing: 0.08em; }
      .actions { grid-template-columns: 1fr; }
      .card { padding: 20px 14px 14px; }
    }

    @media (max-height: 760px) {
      .stage { padding-top: 8px; }
      h1 { font-size: 26px; }
      .dial { width: min(230px, 54vh); margin-bottom: 10px; }
      .display { font-size: clamp(28px, 6vw, 40px); }
      .setters input, .btn { height: 42px; }
      .presets { margin: 10px 0; }
    }

  </style>
</head>
<body>
  <div class="aurora" aria-hidden="true">
    <span></span>
    <span></span>
    <span></span>
  </div>
  <div class="floaters" id="floaters" aria-hidden="true"></div>

  <main class="stage">
    <section class="card" id="card" aria-label="倒计时">
      <header class="brand">
        <span class="sakura" aria-hidden="true"></span>
        <p class="eyebrow">SAKURA GLASS</p>
      </header>
      <h1>樱花倒计时</h1>

      <div class="dial">
        <svg class="ring" viewBox="0 0 200 200" aria-hidden="true">
          <defs>
            <linearGradient id="macaron" x1="0" y1="0" x2="200" y2="0" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="var(--g1)" />
              <stop offset="46%" stop-color="var(--g2)" />
              <stop offset="100%" stop-color="var(--g3)" />
              <animateTransform attributeName="gradientTransform" type="rotate" from="0 100 100" to="360 100 100" dur="7s" repeatCount="indefinite" />
            </linearGradient>
          </defs>
          <circle class="track" cx="100" cy="100" r="76" />
          <circle class="progress" id="progress" cx="100" cy="100" r="76" pathLength="100" />
          <g id="walker" class="walker">
            <ellipse class="shadow" cx="0" cy="1.15" rx="4.8" ry="1.05" />
            <g class="girl-bob">
              <g transform="translate(0,-10.2)">
                <g transform="translate(-1.7,0)">
                  <g class="leg">
                    <animateTransform attributeName="transform" type="rotate" values="32 0 0;-32 0 0;32 0 0" dur="0.5s" repeatCount="indefinite" begin="indefinite" />
                    <line x1="0" y1="0" x2="0" y2="9.5" />
                    <ellipse cx="0.15" cy="9.85" rx="1.2" ry="0.58" />
                  </g>
                </g>
                <g transform="translate(1.7,0)">
                  <g class="leg">
                    <animateTransform attributeName="transform" type="rotate" values="-32 0 0;32 0 0;-32 0 0" dur="0.5s" repeatCount="indefinite" begin="indefinite" />
                    <line x1="0" y1="0" x2="0" y2="9.5" />
                    <ellipse cx="0.15" cy="9.85" rx="1.2" ry="0.58" />
                  </g>
                </g>
              </g>
              <ellipse class="hair" cx="-4.2" cy="-13.5" rx="1.55" ry="2.2" />
              <ellipse class="hair" cx="4.2" cy="-13.5" rx="1.55" ry="2.2" />
              <path class="hair" d="M-3.8 -12.7 C-4.4 -18.3 4.2 -18.5 3.9 -12.5 C2.6 -14.1 1.1 -13.3 0 -14 C-1.4 -13.2 -2.8 -14.2 -3.8 -12.7 Z" />
              <path class="dress" d="M-3.2 -6.5 C-2.1 -5.3 2.1 -5.3 3.2 -6.5 L2.2 -9.8 H-2.2 Z" />
              <path class="top" d="M-1.9 -9.9 H1.9 L1.25 -12 H-1.25 Z" />
              <g transform="translate(-1.45,-11.15)">
                <g class="arm">
                  <animateTransform attributeName="transform" type="rotate" values="-22 0 0;22 0 0;-22 0 0" dur="0.5s" repeatCount="indefinite" begin="indefinite" />
                  <line x1="0" y1="0" x2="-2.05" y2="1.55" />
                  <circle class="hand" cx="-2.28" cy="1.72" r="0.42" />
                </g>
              </g>
              <g transform="translate(1.45,-11.15)">
                <g class="arm">
                  <animateTransform attributeName="transform" type="rotate" values="22 0 0;-22 0 0;22 0 0" dur="0.5s" repeatCount="indefinite" begin="indefinite" />
                  <line x1="0" y1="0" x2="2.05" y2="1.55" />
                  <circle class="hand" cx="2.28" cy="1.72" r="0.42" />
                </g>
              </g>
              <circle class="head" cx="0" cy="-14.5" r="3.4" />
              <path class="bangs" d="M-3.25 -15.5 Q-1.5 -13.6 0 -15.4 Q1.55 -13.6 3.25 -15.5 Q1.7 -17.9 0 -17.6 Q-1.75 -17.9 -3.25 -15.5 Z" />
              <ellipse class="blush" cx="-1.65" cy="-13.6" rx="0.78" ry="0.4" />
              <ellipse class="blush" cx="1.65" cy="-13.6" rx="0.78" ry="0.4" />
              <circle class="eye" cx="-1.2" cy="-14.65" r="0.45" />
              <circle class="eye" cx="1.2" cy="-14.65" r="0.45" />
              <circle cx="-1.05" cy="-14.8" r="0.15" fill="#fff" />
              <circle cx="1.35" cy="-14.8" r="0.15" fill="#fff" />
              <path class="smile" d="M-0.85 -13.45 Q0 -12.9 0.85 -13.45" />
              <path class="bow" d="M2.25 -17.4 L4.45 -18.7 L3.95 -16.6 Z M2.25 -17.4 L4.55 -16.1 L3.15 -15.4 Z" />
              <circle class="bow-knot" cx="2.3" cy="-17.3" r="0.52" />
            </g>
          </g>
        </svg>
        <div class="readout">
          <p class="display" id="display" role="timer" aria-live="polite">00:05:00</p>
        </div>
      </div>
      <p class="status" id="status">准备开始</p>

      <div class="setters">
        <label>
          <span>时</span>
          <input id="hours" type="number" min="0" max="99" value="0" inputmode="numeric" aria-label="小时">
        </label>
        <label>
          <span>分</span>
          <input id="minutes" type="number" min="0" max="59" value="5" inputmode="numeric" aria-label="分钟">
        </label>
        <label>
          <span>秒</span>
          <input id="seconds" type="number" min="0" max="59" value="0" inputmode="numeric" aria-label="秒">
        </label>
      </div>

      <div class="presets" role="group" aria-label="快捷时长">
        <button type="button" data-seconds="60">1 分钟</button>
        <button type="button" data-seconds="300" class="active">5 分钟</button>
        <button type="button" data-seconds="600">10 分钟</button>
        <button type="button" data-seconds="1500">25 分钟</button>
      </div>

      <div class="actions">
        <button type="button" class="btn primary" id="toggle" aria-pressed="false"><span>开始</span></button>
        <button type="button" class="btn ghost" id="reset">重置</button>
      </div>
      <p class="keys">空格 开始 / 暂停 · Esc 重置</p>
    </section>
  </main>

  <script>
    const display = document.getElementById("display");
    const statusEl = document.getElementById("status");
    const toggleBtn = document.getElementById("toggle");
    const toggleLabel = toggleBtn.querySelector("span");
    const resetBtn = document.getElementById("reset");
    const card = document.getElementById("card");
    const hoursInput = document.getElementById("hours");
    const minutesInput = document.getElementById("minutes");
    const secondsInput = document.getElementById("seconds");
    const presetButtons = document.querySelectorAll(".presets button");
    const progress = document.getElementById("progress");
    const walker = document.getElementById("walker");

    const BASE_TITLE = "樱花倒计时";
    const RING_R = 76;
    const GIRL_SCALE = 2;

    let totalMs = 5 * 60 * 1000;
    let remainingMs = totalMs;
    let running = false;
    let finished = false;
    let timerId = null;
    let endAt = 0;
    let walkOn = false;

    function clamp(value, min, max) {
      const number = Number.parseInt(value, 10);
      if (Number.isNaN(number)) return min;
      return Math.min(max, Math.max(min, number));
    }

    function readInputs() {
      const hours = clamp(hoursInput.value, 0, 99);
      const minutes = clamp(minutesInput.value, 0, 59);
      const seconds = clamp(secondsInput.value, 0, 59);
      hoursInput.value = String(hours);
      minutesInput.value = String(minutes);
      secondsInput.value = String(seconds);
      return (hours * 3600 + minutes * 60 + seconds) * 1000;
    }

    function format(ms) {
      const safe = Math.max(0, Math.ceil(ms / 1000));
      const h = String(Math.floor(safe / 3600)).padStart(2, "0");
      const m = String(Math.floor((safe % 3600) / 60)).padStart(2, "0");
      const s = String(safe % 60).padStart(2, "0");
      return `${h}:${m}:${s}`;
    }

    function formatTab(ms) {
      const safe = Math.max(0, Math.ceil(ms / 1000));
      const h = Math.floor(safe / 3600);
      const m = String(Math.floor((safe % 3600) / 60)).padStart(2, "0");
      const s = String(safe % 60).padStart(2, "0");
      return h > 0 ? `${h}:${m}:${s}` : `${m}:${s}`;
    }

    function setLocked(locked) {
      hoursInput.disabled = locked;
      minutesInput.disabled = locked;
      secondsInput.disabled = locked;
      presetButtons.forEach((button) => {
        button.disabled = locked;
      });
    }

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function syncTitle() {
      if (running) document.title = `[${formatTab(remainingMs)}] ${BASE_TITLE}`;
      else if (finished) document.title = `时间到 · ${BASE_TITLE}`;
      else document.title = BASE_TITLE;
    }

    function renderDigits(text, animate) {
      if (display.childElementCount !== text.length) {
        display.replaceChildren();
        [...text].forEach((ch) => {
          const span = document.createElement("span");
          span.className = ch === ":" ? "colon" : "digit";
          span.textContent = ch;
          display.appendChild(span);
        });
        return;
      }
      [...text].forEach((ch, index) => {
        const span = display.children[index];
        if (span.textContent === ch) return;
        span.textContent = ch;
        if (animate && ch !== ":") {
          span.classList.remove("pop");
          void span.offsetWidth;
          span.classList.add("pop");
        }
      });
    }

    function syncWalk(on) {
      if (on === walkOn) return;
      walkOn = on;
      document.querySelectorAll("#walker animateTransform").forEach((node) => {
        if (on) node.beginElement();
        else node.endElement();
      });
    }

    function setRing(ratio) {
      const safe = Math.min(1, Math.max(0, ratio));
      const elapsed = 1 - safe;
      progress.style.strokeDasharray = "100 100";
      progress.style.strokeDashoffset = String(-100 * elapsed);
      const degrees = -90 + elapsed * 360;
      const angle = degrees * Math.PI / 180;
      const x = 100 + RING_R * Math.cos(angle);
      const y = 100 + RING_R * Math.sin(angle);
      const turn = ((degrees % 360) + 360) % 360;
      const faceRight = turn >= 270 || turn < 90;
      const face = faceRight ? GIRL_SCALE : -GIRL_SCALE;
      walker.setAttribute("transform", `translate(${x.toFixed(2)} ${y.toFixed(2)}) scale(${face} ${GIRL_SCALE})`);
    }

    function paint(animateDigits) {
      const leftSeconds = Math.ceil(remainingMs / 1000);
      const ratio = totalMs <= 0 ? 0 : Math.min(1, Math.max(0, remainingMs / totalMs));
      renderDigits(format(remainingMs), animateDigits);
      setRing(ratio);
      card.classList.toggle("is-full", ratio >= 0.997);
      card.classList.toggle("is-empty", ratio <= 0.004);
      card.classList.toggle("is-walking", running && ratio > 0.004);
      syncWalk(running && ratio > 0.004);
      const warn = !finished && leftSeconds > 10 && leftSeconds <= 60;
      const danger = !finished && leftSeconds > 0 && leftSeconds <= 10;
      card.classList.toggle("is-warn", warn);
      card.classList.toggle("is-danger", danger);
      card.classList.toggle("is-done", finished);
      document.body.classList.toggle("is-warn", warn);
      document.body.classList.toggle("is-danger", danger);
      document.body.classList.toggle("is-done", finished);
      syncTitle();
    }

    function applyDuration(ms, label) {
      stopTicker();
      running = false;
      finished = false;
      totalMs = Math.max(0, ms);
      remainingMs = totalMs;
      const totalSeconds = Math.round(totalMs / 1000);
      hoursInput.value = String(Math.floor(totalSeconds / 3600));
      minutesInput.value = String(Math.floor((totalSeconds % 3600) / 60));
      secondsInput.value = String(totalSeconds % 60);
      setLocked(false);
      toggleLabel.textContent = "开始";
      toggleBtn.classList.remove("is-live");
      toggleBtn.setAttribute("aria-pressed", "false");
      setStatus(label || (totalMs > 0 ? "准备开始" : "请先设置时长"));
      presetButtons.forEach((button) => {
        button.classList.toggle("active", Number(button.dataset.seconds) * 1000 === totalMs);
      });
      paint(false);
    }

    function moodStatus() {
      const left = Math.ceil(remainingMs / 1000);
      if (left <= 10) return "最后十秒";
      if (left <= 60) return "最后一分钟";
      return "倒计时进行中";
    }

    function chime() {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      const audio = new AudioCtx();
      const now = audio.currentTime;
      [659.25, 783.99, 1046.5].forEach((frequency, index) => {
        const oscillator = audio.createOscillator();
        const gain = audio.createGain();
        oscillator.type = "sine";
        oscillator.frequency.value = frequency;
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(0.12, now + index * 0.14 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + index * 0.14 + 0.42);
        oscillator.connect(gain);
        gain.connect(audio.destination);
        oscillator.start(now + index * 0.14);
        oscillator.stop(now + index * 0.14 + 0.46);
      });
      setTimeout(() => audio.close(), 1800);
    }

    function finish() {
      stopTicker();
      running = false;
      finished = true;
      remainingMs = 0;
      toggleLabel.textContent = "开始";
      toggleBtn.classList.remove("is-live");
      toggleBtn.setAttribute("aria-pressed", "false");
      setLocked(false);
      setStatus("时间到");
      paint(true);
      chime();
    }

    function frame() {
      remainingMs = Math.max(0, endAt - Date.now());
      if (remainingMs <= 0) {
        finish();
        return;
      }
      setStatus(moodStatus());
      paint(true);
    }

    function stopTicker() {
      if (timerId !== null) {
        cancelAnimationFrame(timerId);
        timerId = null;
      }
    }

    function loop() {
      frame();
      if (running) timerId = requestAnimationFrame(loop);
    }

    function start() {
      if (remainingMs <= 0) {
        const next = readInputs();
        if (next <= 0) {
          setStatus("请先设置时长");
          return;
        }
        totalMs = next;
        remainingMs = next;
      }
      running = true;
      finished = false;
      endAt = Date.now() + remainingMs;
      setLocked(true);
      toggleLabel.textContent = "暂停";
      toggleBtn.classList.add("is-live");
      toggleBtn.setAttribute("aria-pressed", "true");
      setStatus(moodStatus());
      stopTicker();
      timerId = requestAnimationFrame(loop);
    }

    function pause() {
      remainingMs = Math.max(0, endAt - Date.now());
      stopTicker();
      running = false;
      toggleLabel.textContent = "继续";
      toggleBtn.classList.remove("is-live");
      toggleBtn.setAttribute("aria-pressed", "false");
      setStatus("已暂停");
      paint(false);
    }

    function resetTimer() {
      const next = readInputs();
      applyDuration(next > 0 ? next : 5 * 60 * 1000, "已重置");
    }

    function typingTarget(target) {
      return target instanceof HTMLElement && target.closest("input, textarea, select");
    }

    function createFloaters() {
      const root = document.getElementById("floaters");
      for (let i = 0; i < 24; i += 1) {
        const petal = i % 3 !== 0;
        const el = document.createElement("span");
        const size = petal ? 11 + Math.random() * 16 : 8 + Math.random() * 20;
        const duration = 17 + Math.random() * 16;
        el.className = petal ? "floater petal" : "floater bubble";
        el.style.width = `${size}px`;
        el.style.height = `${petal ? size * 1.35 : size}px`;
        el.style.left = `${Math.random() * 100}%`;
        el.style.setProperty("--drift", `${(Math.random() - 0.5) * 140}px`);
        el.style.setProperty("--spin", `${(Math.random() > 0.5 ? 1 : -1) * (140 + Math.random() * 240)}deg`);
        el.style.setProperty("--a", (0.32 + Math.random() * 0.48).toFixed(2));
        el.style.animationDuration = `${duration}s`;
        el.style.animationDelay = `${-Math.random() * duration}s`;
        root.appendChild(el);
      }
    }

    toggleBtn.addEventListener("click", () => {
      if (running) pause();
      else start();
    });

    resetBtn.addEventListener("click", resetTimer);

    presetButtons.forEach((button) => {
      button.addEventListener("click", () => {
        applyDuration(Number(button.dataset.seconds) * 1000, "已选择快捷时长");
      });
    });

    [hoursInput, minutesInput, secondsInput].forEach((input) => {
      input.addEventListener("change", () => {
        if (running) return;
        const next = readInputs();
        totalMs = next;
        remainingMs = next;
        finished = false;
        setStatus(next > 0 ? "准备开始" : "请先设置时长");
        presetButtons.forEach((button) => button.classList.remove("active"));
        paint(false);
      });
    });

    document.addEventListener("keydown", (event) => {
      if (event.repeat) return;
      if (event.code === "Space") {
        if (typingTarget(event.target)) return;
        event.preventDefault();
        if (running) pause();
        else start();
      }
      if (event.key === "Escape") {
        event.preventDefault();
        resetTimer();
      }
    });

    progress.style.strokeDasharray = "100 100";
    createFloaters();
    applyDuration(5 * 60 * 1000);
  </script>
</body>
</html>
